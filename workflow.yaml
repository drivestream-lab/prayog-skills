apiVersion: prayog/v1
kind: SkillWorkflow

id: sdd-delivery
contract: sdd-delivery/v2

entrypoints:
  meta-pm: validate-requirements
  development: spec-draft

nodes:
  validate-requirements:
    type: skill
    profile: meta-pm
    dispatch: manual
    forge:
      commit_workspace: optional
    outcomes:
      pass: prd-impact-map
      findings: review-findings
      needs-input: requirements-human-decision
      failed: requirements-human-decision

  review-findings:
    type: skill
    profile: meta-pm
    dispatch: manual
    forge:
      commit_workspace: optional
    outcomes:
      pass: update-documents
      needs-input: requirements-human-decision
      skipped: workflow-stop

  update-documents:
    type: skill
    profile: meta-pm
    dispatch: manual
    forge:
      commit_workspace: optional
    outcomes:
      pass: validate-requirements
      findings: review-findings
      needs-input: review-findings
      failed: requirements-human-decision

  prd-impact-map:
    type: skill
    profile: meta-pm
    dispatch: manual
    forge:
      commit_workspace: required
    outcomes:
      pass: prd-pr-action
      findings: requirements-human-decision
      needs-input: requirements-human-decision
      blocked: requirements-human-decision
      stale: prd-impact-map
      failed: workflow-stop

  requirements-human-decision:
    type: human-checkpoint
    purpose: requirements-clarification
    outcomes:
      pass: validate-requirements
      skipped: workflow-stop

  prd-pr-action:
    type: external-action
    owner: product
    provider: github
    authorization: explicit
    forge:
      action: open_draft_pr
      draft: true
      apply_labels:
        - impact-map-pending
      remove_labels: []
      requires:
        - title
        - body_path
    outcomes:
      pass: prd-impact-acceptance
      blocked: requirements-human-decision
      failed: workflow-stop

  prd-impact-acceptance:
    type: human-checkpoint
    purpose: prd-impact-acceptance
    owner: engineering-gate
    outcomes:
      pass: prd-merge
      findings: update-documents
      blocked: update-documents
      stale: prd-impact-map

  prd-merge:
    type: external-action
    owner: product
    provider: github
    authorization: explicit
    outcomes:
      pass: spec-draft
      failed: workflow-stop

  spec-draft:
    type: skill
    profile: development
    dispatch: manual
    forge:
      commit_workspace: required
    outcomes:
      pass: spec-pr-action
      needs-input: spec-human-decision
      blocked: spec-human-decision
      stale: prd-impact-map
      failed: workflow-stop

  spec-pr-action:
    type: external-action
    owner: engineering
    provider: github
    authorization: explicit
    forge:
      action: open_draft_pr
      draft: true
      apply_labels:
        - spec-pending
      remove_labels: []
      requires:
        - title
        - body_path
    outcomes:
      pass: initiative-feasibility
      blocked: spec-human-decision
      failed: workflow-stop

  initiative-feasibility:
    type: skill
    profile: development
    dispatch: manual
    forge:
      commit_workspace: required
    outcomes:
      pass: spec-implementation-plan
      findings: spec-technical-review
      needs-input: spec-human-decision
      blocked: spec-human-decision
      stale: spec-draft
      failed: workflow-stop

  spec-technical-review:
    type: skill
    profile: development
    dispatch: manual
    forge:
      commit_workspace: required
    outcomes:
      pass: technical-review-approval
      findings: spec-human-decision
      needs-input: spec-human-decision
      blocked: spec-human-decision
      stale: initiative-feasibility
      failed: workflow-stop

  technical-review-approval:
    type: human-checkpoint
    purpose: tdd-adr-acceptance
    owner: engineering-gate
    outcomes:
      pass: spec-implementation-plan
      findings: spec-technical-review
      blocked: spec-human-decision
      stale: initiative-feasibility

  spec-human-decision:
    type: human-checkpoint
    purpose: spec-clarification
    outcomes:
      pass: initiative-feasibility
      stale: prd-impact-map
      skipped: workflow-stop

  spec-implementation-plan:
    type: skill
    profile: development
    dispatch: manual
    forge:
      commit_workspace: required
    outcomes:
      pass: coding-readiness
      needs-input: spec-human-decision
      blocked: spec-human-decision
      stale: initiative-feasibility
      failed: workflow-stop

  coding-readiness:
    type: human-checkpoint
    purpose: coding-readiness
    owner: engineering-gate
    outcomes:
      pass: spec-merge
      findings: spec-technical-review
      blocked: spec-human-decision
      stale: initiative-feasibility

  spec-merge:
    type: external-action
    owner: engineering
    provider: github
    authorization: explicit
    outcomes:
      pass: board-tickets-action
      failed: workflow-stop

  board-tickets-action:
    type: external-action
    owner: engineering
    provider: github
    authorization: explicit
    forge:
      action: create_board_tickets
      requires:
        - initiative
        - plan_path
    requires:
      - spec-pr-merged
      - implementation-plan-current
      - workmanifest-p14-pass
    outcomes:
      pass: pre-implement
      blocked: board-tickets-action
      failed: workflow-stop

  pre-implement:
    type: skill
    profile: development
    dispatch: orchestrated
    forge:
      commit_workspace: optional
    outcomes:
      pass: loop-spec
      needs-input: wave-signoff
      blocked: wave-signoff
      stale: spec-implementation-plan
      failed: workflow-stop

  loop-spec:
    type: skill
    profile: development
    dispatch: orchestrated
    forge:
      commit_workspace: required
    outcomes:
      pass: live-verify
      findings: loop-spec
      blocked: wave-signoff
      failed: loop-spec

  live-verify:
    type: human-checkpoint
    purpose: live-verify
    outcomes:
      pass: wave-awaiting-closeout
      findings: loop-spec
      blocked: workflow-stop

  wave-awaiting-closeout:
    type: terminal

  verify:
    type: skill
    profile: development
    dispatch: manual
    forge:
      commit_workspace: optional
    outcomes:
      pass: learning-extract
      skipped: learning-extract
      findings: loop-spec
      blocked: wave-signoff
      failed: loop-spec

  learning-extract:
    type: skill
    profile: development
    dispatch: orchestrated
    forge:
      commit_workspace: optional
    outcomes:
      pass: ground-spec
      findings: learning-extract
      needs-input: wave-signoff
      blocked: wave-signoff
      failed: learning-extract

  ground-spec:
    type: skill
    profile: development
    dispatch: orchestrated
    forge:
      commit_workspace: required
    outcomes:
      pass: wave-signoff
      findings: loop-spec
      needs-input: wave-signoff
      blocked: wave-signoff
      failed: loop-spec

  wave-signoff:
    type: human-checkpoint
    purpose: wave-signoff
    outcomes:
      pass: wave-complete
      findings: loop-spec
      blocked: workflow-stop

  wave-complete:
    type: decision
    outcomes:
      pass: pre-implement
      skipped: initiative-closure

  initiative-closure:
    type: human-checkpoint
    purpose: initiative-closure
    outcomes:
      pass: workflow-complete
      findings: wave-signoff

  workflow-complete:
    type: terminal

  workflow-stop:
    type: terminal
